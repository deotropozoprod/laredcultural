<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video y Registro</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background: #000; 
            font-family: Arial, sans-serif;
        }
        
        /* Estilos del Video */
        video { 
            width: 100%; 
            height: 100%; 
            object-fit: contain; 
            position: absolute; 
            top: 0; 
            left: 0; 
            z-index: 1;
        }

        /* Capa oscura que cubre el video al finalizar (Oculta al inicio) */
        .overlay-pantalla {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
            background-color: rgba(0, 0, 0, 0.6); /* 60% de oscuridad sobre el video congelado */
        }

        /* Cuando el video termina, activamos esta capa */
        .overlay-pantalla.show {
            opacity: 1;
            pointer-events: auto;
        }

        /* Botón Inicial de "Registrarse" */
        .btn-abrir-registro {
            padding: 20px 40px;
            font-size: 22px;
            font-weight: bold;
            color: #fff;
            background-color: #28a745; /* Color Verde Llamativo */
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            transition: transform 0.2s, background 0.3s;
        }

        .btn-abrir-registro:hover {
            background-color: #218838;
            transform: scale(1.05); /* Se agranda un poquito al pasar el mouse */
        }

        /* Tarjeta del Formulario Blanca (Oculta por defecto con display: none) */
        form {
            display: none; 
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            animation: aparecerEfecto 0.4s ease forwards;
        }

        /* Animación suave para cuando aparece el formulario */
        @keyframes aparecerEfecto {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        form h2 {
            margin-bottom: 20px;
            color: #333;
            text-align: center;
            font-size: 24px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: #666;
            font-size: 14px;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
        }

        .input-group input:focus {
            border-color: #007bff;
        }

        /* Botón de enviar formulario */
        .btn-submit {
            width: 100%;
            padding: 12px;
            background: #007bff; /* Color Azul */
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
            transition: background 0.3s;
        }

        .btn-submit:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>

    <video id="miVideo" autoplay muted playsinline>
        <source src="tu-video.mp4" type="video/mp4">
    </video>

    <!-- Contenedor que maneja todo lo que pasa encima del video -->
    <div id="capaInteractiva" class="overlay-pantalla">
        
        <!-- 1. Botón inicial que verá el usuario -->
        <button id="btnRegistrarse" class="btn-abrir-registro">Registrarse</button>

        <!-- 2. Formulario que está escondido al principio -->
        <form id="registroForm">
            <h2>Registro</h2>
            
            <div class="input-group">
                <label for="nombre">Nombre completo</label>
                <input type="text" id="nombre" required placeholder="Tu nombre">
            </div>

            <div class="input-group">
                <label for="telefono">Teléfono</label>
                <input type="tel" id="telefono" required placeholder="Tu número de teléfono">
            </div>

            <div class="input-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" required placeholder="tu@email.com">
            </div>

            <button type="submit" class="btn-submit">Enviar Registro</button>
        </form>

    </div>

    <!-- Lógica de control con JavaScript -->
    <script>
        const video = document.getElementById('miVideo');
        const capaInteractiva = document.getElementById('capaInteractiva');
        const btnRegistrarse = document.getElementById('btnRegistrarse');
        const elFormulario = document.getElementById('registroForm');

        // Paso 1: Detectar cuando termina el video y mostrar el botón verde
        video.addEventListener('ended', function() {
            capaInteractiva.classList.add('show'); 
        });

        // Paso 2: Detectar clic en el botón verde, ocultarlo y mostrar la tarjeta blanca
        btnRegistrarse.addEventListener('click', function() {
            btnRegistrarse.style.display = 'none'; // Esconde el botón verde
            elFormulario.style.display = 'block';  // Muestra el formulario de datos
        });

        // Paso 3: Controlar el envío del formulario
        elFormulario.addEventListener('submit', function(e) {
            e.preventDefault();
            alert('¡Datos recibidos!');
        });
    </script>

</body>
</html>
