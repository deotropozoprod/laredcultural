<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Video</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 80%; height: 80%; overflow: hidden; background: #000; }
        video { width: 80vw; height: 80vh; object-fit: cover; position: absolute; top: 0; left: 0; }
    </style>
</head>
<body>
    <video autoplay muted playsinline>
        <source src="tu-video.mp4" type="video/mp4">
    </video>
</body>
</html>
