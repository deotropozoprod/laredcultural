<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Video</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; }
        video { 
            width: 100%; 
            height: 100%; 
            object-fit: fill; /* Cambiado a fill para forzar el tamaño exacto de la pantalla */
            position: absolute; 
            top: 0; 
            left: 0; 
        }
    </style>
</head>
<body>
    <video autoplay muted playsinline>
        <source src="tu-video.mp4" type="video/mp4">
    </video>
</body>
</html>
